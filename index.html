<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1C1C1C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shoes" />

  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <title>Shoe Stock</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">
  <main id="view-container">

    <!-- ════ STOCK ════ -->
    <div id="view-stock" class="view active">
      <div class="page-header" id="stock-header"></div>

      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="stock-search" type="search" placeholder="Brand, model, colour…" oninput="searchStock(this.value)" autocomplete="off" />
          <button id="stock-clear" onclick="clearStockSearch()" style="display:none;">×</button>
        </div>
      </div>

      <div id="stock-filters"></div>
      <div id="stock-grid" class="grid"></div>
    </div>

    <!-- ════ PLACES ════ -->
    <div id="view-places" class="view">
      <div class="page-header">
        <h1>Places</h1>
        <div class="subtitle">What should be where</div>
      </div>
      <div id="places-body" class="places-body"></div>
    </div>

    <!-- ════ OWED ════ -->
    <div id="view-owed" class="view">
      <div class="page-header">
        <h1>Owed to me</h1>
        <div class="subtitle" id="owed-total">₦0.00</div>
      </div>
      <div id="owed-body" class="owed-body"></div>
    </div>

    <!-- ════ TOTALS ════ -->
    <div id="view-totals" class="view">
      <div class="page-header">
        <h1>Totals</h1>
        <div class="subtitle">Stock, sales and profit</div>
      </div>
      <div id="totals-body"></div>
    </div>

    <!-- ════ SETTINGS ════ -->
    <div id="view-settings" class="view"></div>

    <!-- ════ ADD / EDIT FORM ════ -->
    <div id="view-form" class="view"></div>

  </main>

  <!-- Floating add button, visible on the stock grid -->
  <button id="fab" onclick="openAdd()" aria-label="Add pair">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav id="bottom-nav" role="navigation" aria-label="Main">
    <button id="nav-stock" class="nav-btn active" onclick="navigate('stock')" aria-label="Stock">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Stock
    </button>
    <button id="nav-places" class="nav-btn" onclick="navigate('places')" aria-label="Places">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Places
    </button>
    <button id="nav-owed" class="nav-btn" onclick="navigate('owed')" aria-label="Owed to me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg>
      Owed
    </button>
    <button id="nav-totals" class="nav-btn" onclick="navigate('totals')" aria-label="Totals">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      Totals
    </button>
    <button id="nav-settings" class="nav-btn" onclick="navigate('settings')" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </nav>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="lib/idb.js"></script>
<script src="js/db.js"></script>
<script src="js/money.js"></script>
<script src="js/lock.js"></script>
<script src="js/settings.js"></script>
<script src="js/stock.js"></script>
<script src="js/views.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>

</body>
</html>
